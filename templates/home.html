<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APMC Market Data — Select City</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6D4C41;
            --secondary: #D4A017;
            --accent: #689F38;
            --bg: #FFF8E1;
            --card: rgba(255, 255, 255, 0.95);
            --border: rgba(0, 0, 0, 0.1);
            --text: #4E342E;
            --muted: #8D6E63;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image:
                linear-gradient(rgba(255, 248, 225, 0.85), rgba(255, 248, 225, 0.85)),
                url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 620px;
            width: 100%;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 2.2rem;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
        }

        select {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.03);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        select:focus {
            border-color: rgba(164, 198, 57, 0.5);
            box-shadow: 0 0 0 3px rgba(164, 198, 57, 0.15);
        }

        select option {
            background: white;
            color: var(--text);
            padding: 10px;
        }

        button[type="submit"],
        button[type="button"] {
            width: 100%;
            padding: 1rem;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(46, 125, 50, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button[type="submit"]:hover,
        button[type="button"]:not([disabled]):hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(46, 125, 50, 0.3);
        }

        .btn-news {
            flex: 1;
            padding: 1rem;
            border-radius: 50px;
            background: linear-gradient(135deg, #689F38, #33691E);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(104, 159, 56, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-news:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(104, 159, 56, 0.3);
        }

        .btn-history {
            flex: 1;
            padding: 1rem;
            border-radius: 50px;
            background: linear-gradient(135deg, #7E57C2, #4527A0);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(126, 87, 194, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-history:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(126, 87, 194, 0.3);
        }

        .action-container {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            width: 100%;
        }

        @media (max-width: 450px) {
            .action-container {
                flex-direction: column;
            }
        }

        /* ── Dark Mode ── */
        body.dark-mode {
            --bg: #14161a;
            --card: rgba(30, 33, 42, 0.98);
            --border: rgba(255, 255, 255, 0.08);
            --text: #e8e0d4;
            --muted: #a89080;
            background-color: #14161a;
            background-image:
                linear-gradient(rgba(20, 22, 26, 0.92), rgba(20, 22, 26, 0.92)),
                url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1920&q=80');
        }
        body.dark-mode select,
        body.dark-mode input[type="date"] {
            background: rgba(255,255,255,0.06) !important;
            color: var(--text) !important;
            border-color: rgba(255,255,255,0.12) !important;
            color-scheme: dark;
        }
        .dark-toggle {
            position: fixed;
            top: 1.2rem;
            right: 1.2rem;
            z-index: 9999;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #D4A017, #6D4C41);
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dark-toggle:hover { transform: scale(1.12); box-shadow: 0 6px 24px rgba(0,0,0,0.3); }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">🌾</div>
        <h1>APMC Gujarat</h1>
        <p class="subtitle">Select your market city to begin</p>

        <form method="POST" action="/search" id="mainForm">
            <label for="city">Select City</label>
            <select name="city" id="city" required onchange="fetchItems()">
                <option value="" disabled>— Choose a city —</option>
                <option value="Rajkot" selected>Rajkot</option>
                <option value="Gondal">Gondal</option>
                <option value="Ahmedabad">Ahmedabad</option>
            </select>

            <div id="item-section">
                <label for="item">Select Commodity</label>
                <select name="item" id="item" required>
                    <option value="" disabled selected>— Loading —</option>
                </select>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label for="from_date">From Date</label>
                        <input type="date" name="from_date" id="from_date" required
                            style="width: 100%; padding: 0.85rem 1rem; border-radius: 12px; border: 1px solid var(--border); background: rgba(0, 0, 0, 0.03); color: var(--text); font-family: 'Outfit', sans-serif; font-size: 1rem; margin-bottom: 1.5rem; outline: none;" />
                    </div>
                    <div>
                        <label for="to_date">To Date</label>
                        <input type="date" name="to_date" id="to_date" required
                            style="width: 100%; padding: 0.85rem 1rem; border-radius: 12px; border: 1px solid var(--border); background: rgba(0, 0, 0, 0.03); color: var(--text); font-family: 'Outfit', sans-serif; font-size: 1rem; margin-bottom: 1.5rem; outline: none;" />
                    </div>
                </div>

                <input type="hidden" name="view_type" value="table" />
                <button type="submit" id="searchBtn">🔍 Search Market Prices</button>
            </div>
        </form>

        <div class="action-container">
            <a href="/news" class="btn-news">📰 Farmer News</a>
            <a href="/history" class="btn-history">⏳ History</a>
        </div>
    </div>

    <script>
        async function fetchItems() {
            const city = document.getElementById("city").value;
            const select = document.getElementById("item");

            if (!city) return;

            select.innerHTML = '<option value="" disabled selected>— Loading items... —</option>';

            // Set default dates
            const fromEl = document.getElementById("from_date");
            const toEl = document.getElementById("to_date");
            if (fromEl && !fromEl.value) fromEl.value = "2020-01-01";
            if (toEl && !toEl.value) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                toEl.value = `${yyyy}-${mm}-${dd}`;
            }

            try {
                const response = await fetch(`/api/items?city=${encodeURIComponent(city)}`);
                const items = await response.json();

                if (items.error) {
                    select.innerHTML = `<option value="" disabled>Error: ${items.error}</option>`;
                    return;
                }

                let options = '<option value="" disabled selected>— Choose an item —</option>';
                items.forEach(i => {
                    options += `<option value="${i.val}">${i.name}</option>`;
                });

                select.innerHTML = options;
            } catch (err) {
                select.innerHTML = '<option value="" disabled>Network error — check server</option>';
                console.error("fetchItems error:", err);
            }
        }

        // Auto-load on page open
        document.addEventListener("DOMContentLoaded", fetchItems);

        // Save search to localStorage history before submitting
        document.getElementById("mainForm").addEventListener("submit", function () {
            const city     = document.getElementById("city").value;
            const item     = document.getElementById("item").value;
            const fromDate = document.getElementById("from_date").value;
            const toDate   = document.getElementById("to_date").value;

            if (!city || !item) return;

            const entry = {
                city,
                item,
                from_date: fromDate,
                to_date: toDate,
                searched_at: new Date().toLocaleString()
            };

            let history = JSON.parse(localStorage.getItem("apmc_search_history") || "[]");
            const last = history[0];
            if (!last || last.city !== entry.city || last.item !== entry.item ||
                last.from_date !== entry.from_date || last.to_date !== entry.to_date) {
                history.unshift(entry);
                if (history.length > 50) history.pop();
                localStorage.setItem("apmc_search_history", JSON.stringify(history));
            }
        });
    </script>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDark()" title="Toggle Dark Mode">🌙</button>
    <script>
        function toggleDark() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('apmc_dark', isDark ? '1' : '0');
            document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
        }
        (function() {
            if (localStorage.getItem('apmc_dark') === '1') {
                document.body.classList.add('dark-mode');
                document.addEventListener('DOMContentLoaded', function() {
                    var btn = document.getElementById('darkToggle');
                    if (btn) btn.textContent = '☀️';
                });
            }
        })();
    </script>
</body>

</html>
