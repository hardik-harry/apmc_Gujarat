<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #FFF8E1;
            background-image: linear-gradient(rgba(255, 248, 225, 0.85), rgba(255, 248, 225, 0.85)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 2rem;
            color: #4E342E;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #D4A017, #6D4C41);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #689F38;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .card a {
            color: #689F38;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: color 0.2s;
        }

        .card a:hover {
            color: #4E342E;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(135deg, #D4A017, #6D4C41);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: translateY(-2px);
        }

        /* ── Dark Mode ── */
        body.dark-mode {
            background-color: #14161a;
            background-image: linear-gradient(rgba(20,22,26,0.92),rgba(20,22,26,0.92)),url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1920&q=80');
            color: #e8e0d4;
        }
        body.dark-mode .header,
        body.dark-mode .card {
            background: rgba(30, 33, 42, 0.98);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        body.dark-mode .card h3 { color: #e8e0d4; }
        body.dark-mode .card a { color: #8bc34a; }
        body.dark-mode .header p { color: #a89080; }
        .dark-toggle {
            position: fixed; top: 1.2rem; right: 1.2rem; z-index: 9999;
            width: 48px; height: 48px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #D4A017, #6D4C41); color: white;
            font-size: 1.3rem; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transition: transform 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .dark-toggle:hover { transform: scale(1.12); }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn" style="float: left; margin-bottom: 20px;">⬅ Back to Home</a>
            <div style="clear: both;"></div>
            <h1>📰 Latest Farmer News</h1>
            <p>Sourced from Divya Bhaskar</p>
        </div>

        {% if news %}
        {% for item in news %}
        <div class="card">
            <h3>{{ item.title }}</h3>
            {% if item.link %}
            <a href="{{ item.link }}" target="_blank">Read Full Article ➔</a>
            {% endif %}
        </div>
        {% endfor %}
        {% else %}
        <div class="card" style="text-align: center; border-left-color: #D4A017;">
            <h3>No news found at the moment or there was an issue connecting to the source.</h3>
        </div>
        {% endif %}
    </div>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDark()">🌙</button>
    <script>
        function toggleDark() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('apmc_dark', isDark ? '1' : '0');
            document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
        }
        (function() {
            if (localStorage.getItem('apmc_dark') === '1') {
                document.body.classList.add('dark-mode');
                document.addEventListener('DOMContentLoaded', function() {
                    var b = document.getElementById('darkToggle'); if(b) b.textContent='☀️';
                });
            }
        })();
    </script>
</body>

</html>
